name: Release

# Push a tag like v0.2.1 to release. npm authenticates this workflow with OIDC (trusted publishing:
# npmjs.com → dopus → Settings → Trusted Publisher: akodm/dopus, release.yml, environment git-action-publisher,
# permission "npm stage publish"), so no token is stored.
#
# The package is *staged*, not published: a maintainer approves it on npmjs.com (Staged Packages, 2FA) or with
# `npm stage approve <stage-id>`. The GitHub Release is created as a draft; publish it after the npm approval.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment configured for the npm trusted publisher.
    environment: git-action-publisher
    permissions:
      contents: write # create the draft GitHub Release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag must match package version
        run: |
          VERSION=$(node -p "require('./packages/dopus/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/dopus version $VERSION" >&2
            exit 1
          fi
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm example:build
      - run: pnpm example:e2e
      - run: pnpm smoke

      # Staged publishing needs npm >= 11.15.0.
      - run: npm install -g npm@^11.15.0
      - name: Stage on npm
        working-directory: packages/dopus
        # --loglevel verbose shows the OIDC token exchange result if trusted publishing is misconfigured.
        run: npm stage publish --access public --provenance --loglevel verbose

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md"
