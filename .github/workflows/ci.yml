name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm example:build
      # Starts `next start` with a scripted model: tools must see the caller's cookies.
      - run: pnpm example:e2e
      # The copied chat UI in real browsers (Playwright, scripted model): Chromium, Firefox and WebKit, one server each.
      - if: matrix.node == 24
        # --with-deps adds the apt packages WebKit and Firefox need; retry once without them if an apt mirror is down
        # (Chromium still runs then, and the browsers that lack libraries fail loudly).
        run: |
          pnpm --filter next-app exec playwright install --with-deps --only-shell chromium firefox webkit ||
          pnpm --filter next-app exec playwright install --only-shell chromium firefox webkit
      - if: matrix.node == 24
        run: pnpm example:ui
      - if: failure() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: examples/next-app/test-results/
          retention-days: 7

  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Installs the packed tarball into a fresh Next.js app, runs `dopus init`, then `next build`.
      - run: pnpm smoke
