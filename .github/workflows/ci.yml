name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm example:build
      # Starts `next start` with a scripted model: tools must see the caller's cookies.
      - run: pnpm example:e2e
      # The copied chat UI in a real browser (Playwright, scripted model): approvals, stale cards, background jobs.
      - if: matrix.node == 24
        # --with-deps adds apt packages (mostly fonts); the runner image already has the libraries Chromium needs, so
        # an apt mirror outage should not block the run.
        run: |
          pnpm --filter next-app exec playwright install --with-deps --only-shell chromium ||
          pnpm --filter next-app exec playwright install --only-shell chromium
      - if: matrix.node == 24
        run: pnpm example:ui
      - if: failure() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: examples/next-app/test-results/
          retention-days: 7

  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Installs the packed tarball into a fresh Next.js app, runs `dopus init`, then `next build`.
      - run: pnpm smoke

  aws-lambda-emu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # OpenNext build of the example + local invoke with Function URL events (no AWS account).
      - run: pnpm aws:emu

  cloudflare-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # dopus infra cloudflare on a copy of the example → OpenNext build → wrangler dev (workerd) → e2e. No account.
      - run: pnpm cf:e2e

  gcp-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # dopus infra gcp on a copy of the example → docker build → docker run (PORT=8080) → e2e. No GCP account.
      - run: pnpm gcp:e2e
